# Dashboard (frontend principal) — escucha en el puerto 80
# El reverse proxy externo (traefik/nginx del host) enruta el dominio raíz aquí.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy del API al backend
    location /api/ {
        proxy_pass http://api:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: todas las rutas no-estáticas vuelven al index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de assets con hash (Vite genera nombres con hash)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
