# ============================================================
# CI/CD — Despliegue continuo a la VPS
# Disparador: push/merge a la rama PRODUCCION (NO en main)
# Acción: hace SSH a la VPS y ejecuta docker compose up -d --build
#
# Flujo de trabajo recomendado:
#   1. Trabajás en main (o ramas) y subís cambios — NO se despliega
#   2. Cuando querés publicar: main → produccion (merge o push)
#   3. GitHub Actions despliega automáticamente a la VPS
# ============================================================
name: Deploy to VPS

on:
  push:
    branches: [produccion]
  workflow_dispatch: # permitir deploy manual desde GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Conecta por SSH a la VPS y despliega
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ~/sistema-salon-belleza-gloss
            # Cambiar a la rama produccion y traer los cambios
            git fetch origin
            git checkout produccion 2>/dev/null || git checkout -b produccion origin/produccion
            git pull origin produccion
            # Copiar el .env si no existe (primera vez)
            if [ ! -f .env ]; then cp .env.production.example .env; fi
            # Construir y levantar
            docker compose -f docker-compose.prod.yml up -d --build
            # Limpiar imágenes viejas
            docker image prune -f
