# OpenSpec Configuration — sistema-salon-belleza-gloss
# Updated by sdd-init | 2026-06-14

schema: spec-driven

context: |
  Monorepo for a salon SaaS management system.
  Backend: Express + TypeScript + TypeORM + MySQL + tsyringe (hexagonal architecture).
  Frontend (×2): React 18 + Vite 5 (Dashboard: salon owners; Superadmin: cross-tenant admin).
  Shared packages: types, validation (Zod), ui (React components), config (eslint/prettier/tsconfig presets).
  DI via tsyringe; npm workspaces monorepo; Docker Compose for MySQL (3307) and n8n.

strict_tdd: true
# Reason: vitest detected in all 3 apps (api v1.6.0, dashboard v1.6.0, superadmin v1.6.0).
# 31 existing test files in api. Defaulted to true per SDD convention when runner present.

testing:
  available: true
  runner: vitest
  framework: vitest ^1.6.0
  layers:
    unit: true
    integration: true
    e2e: false
  coverage:
    available: true
    provider: v8
    command: "cd apps/api && npx vitest run --coverage"
  quality:
    linter: "eslint (typescript-eslint flat config)"
    type_checker: "tsc --noEmit"
    formatter: "prettier (config in packages/config/)"

test_commands:
  api: "cd apps/api && npx vitest run"
  dashboard: "cd apps/pos-dashboard && npx vitest run"
  superadmin: "cd apps/superadmin && npx vitest run"

phases:
  proposal: { required: true, auto_skip: false }
  spec: { required: true, auto_skip: false }
  design: { required: true, auto_skip: false }
  tasks: { required: true, auto_skip: false }
  apply:
    required: true
    auto_skip: false
    rules:
      tdd: true
      test_command: "cd apps/api && npx vitest run --reporter=verbose"
  verify:
    required: true
    auto_skip: false
    test_command: "cd apps/api && npx vitest run --coverage --reporter=verbose"
    build_command: "cd apps/api && npx tsc --noEmit"
    coverage_threshold: 80
  archive: { required: true, auto_skip: false }
